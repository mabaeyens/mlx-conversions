[project]
name = "mlx-conversions"
version = "0.1.0"
description = "Quantize HuggingFace models to MLX format and publish to mlx-community"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx-lm>=0.20",
    "huggingface-hub>=0.25",
    "mlx-vlm>=0.6.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
